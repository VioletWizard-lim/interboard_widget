name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # GitHub 러너에는 Android SDK 가 이미 설치되어 있음 (ANDROID_HOME)
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../manneung-chalkpan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manneung-chalkpan-apk
          path: manneung-chalkpan.apk
