plugins {
    id 'com.android.application'
}

android {
    namespace 'com.interboard.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.interboard.widget'
        minSdk 21
        targetSdk 34
        // GitHub Actions 빌드 번호를 버전 번호로 사용 (화면 오른쪽 위 "Ver"에도 표시됨)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "2.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 저장소 맨 위의 index.html 을 그대로 앱에 넣는다 (웹/앱이 같은 파일을 사용)
def webAssetsDir = layout.buildDirectory.dir('generated/webAssets').get().asFile
def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('../index.html'))
    into(webAssetsDir)
    // 화면의 버전 표시에 빌드 번호 넣기
    def build = System.getenv('GITHUB_RUN_NUMBER') ?: 'local'
    inputs.property('build', build)
    filter { String line -> line.replace('@@BUILD@@', build) }
}
android.sourceSets.main.assets.srcDir(webAssetsDir)
tasks.named('preBuild') { dependsOn copyWebAssets }
